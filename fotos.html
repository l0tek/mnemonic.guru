<!doctype html>
<html lang="de" data-bs-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mnemonic.guru - Fotos</title>
    </head>
    <body class="gallery-page subgallery-page" data-gallery-category="fotos">
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
            <div class="container">
                <a class="navbar-brand" href="/index.html">mnemonic.guru</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#nav"
                    aria-controls="nav"
                    aria-expanded="false"
                    aria-label="Navigation umschalten"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div id="nav" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto gap-2 align-items-lg-center">
                        <li class="nav-item">
                            <button
                                id="theme-toggle"
                                class="btn btn-outline-secondary theme-toggle"
                                type="button"
                                aria-label="Zu Darkmode wechseln"
                            >
                                <span class="theme-icon" aria-hidden="true"
                                    >&#127769;</span
                                >
                            </button>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">Home</a>
                        </li>
                        <li class="nav-item dropdown d-flex align-items-center">
                            <a class="nav-link" href="/gallery.html">Gallery</a>
                            <button
                                class="btn btn-link nav-link dropdown-toggle px-2"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                aria-label="Gallery Untermenue"
                            ></button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="/fraktale.html"
                                        >Fraktale</a
                                    >
                                </li>
                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="/digitalart.html"
                                        >Digital Art</a
                                    >
                                </li>
                                <li>
                                    <a
                                        class="dropdown-item active"
                                        aria-current="page"
                                        href="/fotos.html"
                                        >Fotos</a
                                    >
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <header class="mb-4">
                <p class="text-uppercase text-body-secondary fw-semibold mb-1">
                    Sektion
                </p>
                <h1 id="subgallery-title" class="display-6 fw-bold mb-2">
                    Fotos
                </h1>
                <p id="subgallery-description" class="text-body-secondary mb-0">
                    Fotografien und visuelle Momentaufnahmen.
                </p>
            </header>

            <div id="subgallery-status" class="text-body-secondary mb-3">
                Lade Bilder...
            </div>
            <div
                id="subgallery-grid"
                class="gallery-grid"
                aria-live="polite"
            ></div>
        </main>

        <div
            id="blueimp-gallery"
            class="blueimp-gallery"
            aria-label="image gallery"
            aria-modal="true"
            role="dialog"
        >
            <div class="slides" aria-live="polite"></div>
            <h3 class="title"></h3>
            <a
                class="prev"
                aria-controls="blueimp-gallery"
                aria-label="previous slide"
            ></a>
            <a
                class="next"
                aria-controls="blueimp-gallery"
                aria-label="next slide"
            ></a>
            <a
                class="close"
                aria-controls="blueimp-gallery"
                aria-label="close"
            ></a>
            <a
                class="play-pause"
                aria-controls="blueimp-gallery"
                aria-label="play slideshow"
            ></a>
            <ol class="indicator"></ol>
        </div>

        <script type="module" src="/src/subgallery.js"></script>
    </body>
</html>
