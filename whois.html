        <main class="container py-5">
            <header class="mb-4">
                <p class="text-uppercase text-body-secondary fw-semibold mb-1">
                    Tools / Whois
                </p>
                <h1 class="display-6 fw-bold mb-2">Whois Lookup</h1>
                <p class="text-body-secondary mb-0">
                    Domain eingeben und Whois-Daten direkt anzeigen.
                </p>
            </header>

            <section class="card border-0 shadow-sm">
                <div class="card-body">
                    <form id="whois-form" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label" for="whois-mode"
                                >Modus</label
                            >
                            <select id="whois-mode" class="form-select">
                                <option value="whois">Whois</option>
                                <option value="reverse">Reverse Whois</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label
                                id="whois-query-label"
                                class="form-label"
                                for="whois-domain"
                                >Domain</label
                            >
                            <input
                                id="whois-domain"
                                class="form-control"
                                type="text"
                                placeholder="example.com"
                                required
                                autocomplete="off"
                            />
                        </div>
                        <div class="col-md-3 d-grid">
                            <button class="btn btn-primary" type="submit">
                                Whois abfragen
                            </button>
                        </div>
                    </form>
                    <p
                        id="whois-status"
                        class="small text-body-secondary mt-3 mb-0"
                    >
                        Bereit.
                    </p>
                    <pre
                        id="whois-result"
                        class="mt-3 p-3 rounded border whois-result"
                        aria-live="polite"
                    ></pre>
                </div>
            </section>
        </main>
